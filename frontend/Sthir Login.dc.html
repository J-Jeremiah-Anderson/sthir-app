<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#F7F9FA; font-family:'Inter',system-ui,sans-serif; color:#0F172A; }
  a { color:#0f766e; } a:hover { color:#0b5a54; }
  input:focus { outline:none; border-color:#0f766e !important; box-shadow:0 0 0 3px rgba(15,118,110,.12); }
  @keyframes sthirRise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:#F7F9FA">
  <div style="width:380px;max-width:100%;animation:sthirRise .3s ease both">
    <div style="display:flex;align-items:center;gap:10px;justify-content:center">
      <span style="width:34px;height:34px;border-radius:8px;background:#0F766E;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px">S</span>
      <span style="font-size:18px;font-weight:800;letter-spacing:-.01em">Sthir</span>
    </div>
    <div style="margin-top:6px;text-align:center;font-size:13px;color:#475569">{{ portalLabel }}</div>

    <div style="margin-top:24px;padding:28px;border-radius:12px;border:1px solid #E5E7EB;background:#FFFFFF">
      <label style="display:block;font-size:12px;font-weight:600;color:#334155">{{ idLabel }}</label>
      <input value="{{ userId }}" onChange="{{ onUserId }}" placeholder="{{ idPlaceholder }}" style="margin-top:6px;width:100%;box-sizing:border-box;padding:11px 12px;border-radius:8px;border:1px solid #D1D5DB;background:#FFFFFF;font:500 14px 'Inter',sans-serif;color:#0F172A" />
      <label style="display:block;margin-top:16px;font-size:12px;font-weight:600;color:#334155">Password</label>
      <input value="{{ password }}" onChange="{{ onPassword }}" type="password" placeholder="••••••••" style="margin-top:6px;width:100%;box-sizing:border-box;padding:11px 12px;border-radius:8px;border:1px solid #D1D5DB;background:#FFFFFF;font:500 14px 'Inter',sans-serif;color:#0F172A" />
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid #FECACA;background:#FEF2F2;font-size:12px;color:#DC2626">{{ errorText }}</div>
      </sc-if>
      <button onClick="{{ signIn }}" style="margin-top:20px;width:100%;cursor:pointer;padding:12px;border-radius:8px;border:0;background:#0F766E;color:#FFFFFF;font:700 14px 'Inter',sans-serif;transition:background .15s" style-hover="background:#0b5a54">{{ signInLabel }}</button>
      <div style="margin-top:14px;text-align:center;font-size:12px;color:#64748B">Demo — any credentials work · <span onClick="{{ fillDemo }}" style="color:#0f766e;font-weight:600;cursor:pointer">use demo account</span></div>
    </div>

    <div style="margin-top:20px;text-align:center;font-size:12px;color:#64748B"><a href="Sthir%20Portals.dc.html" style="text-decoration:none">← Back to portal selection</a></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1000&quot;,&quot;height&quot;:&quot;720&quot;}}">
const PORTALS = {
  worker: { label:'Worker portal · sign in', idLabel:'Mobile number', idPlaceholder:'98400 12345', demoId:'98400 12345', target:'Sthir%20Worker%20Web.dc.html', cta:'Sign in' },
  lender: { label:'Lender console · sign in', idLabel:'Work email', idPlaceholder:'analyst@nbfc.in', demoId:'analyst@nbfc.in', target:'Sthir%20Lender%20Console.dc.html', cta:'Sign in to console' },
};

class Component extends DCLogic {
  state = { userId:'', password:'', error:null };

  portalKey() {
    try {
      const q = new URLSearchParams(window.location.search).get('portal');
      return PORTALS[q] ? q : 'worker';
    } catch (e) { return 'worker'; }
  }

  signIn = () => {
    const { userId, password } = this.state;
    if (!userId.trim() || !password.trim()) {
      this.setState({ error:'Enter both fields — or tap “use demo account”.' });
      return;
    }
    window.location.href = PORTALS[this.portalKey()].target;
  };

  renderVals() {
    const p = PORTALS[this.portalKey()];
    return {
      portalLabel: p.label, idLabel: p.idLabel, idPlaceholder: p.idPlaceholder, signInLabel: p.cta,
      userId: this.state.userId, password: this.state.password,
      hasError: !!this.state.error, errorText: this.state.error || '',
      onUserId: e => this.setState({ userId: e.target.value, error:null }),
      onPassword: e => this.setState({ password: e.target.value, error:null }),
      fillDemo: () => this.setState({ userId: p.demoId, password: 'sthir-demo', error:null }),
      signIn: this.signIn,
    };
  }
}

</script>
</body>
</html>
