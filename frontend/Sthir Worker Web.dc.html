<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#F7F9FA; font-family:'Inter','Noto Sans Tamil','Noto Sans Devanagari',system-ui,sans-serif; color:#0F172A; }
  a { color:#0f766e; } a:hover { color:#0b5a54; }
  @keyframes sthirRise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes sthirPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes sthirFill { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes sthirSpin { to { transform:rotate(360deg); } }
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#F7F9FA">

  <header style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 28px;background:rgba(247,245,238,.85);border-bottom:1px solid #E5E7EB">
    <a href="Sthir%20Portals.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0F172A">
      <span style="width:32px;height:32px;border-radius:8px;background:#0F766E;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px">S</span>
      <span style="font-size:16px;font-weight:800;letter-spacing:-.01em">Sthir <span style="font-weight:600;color:#64748B">· Worker portal</span></span>
    </a>
    <span style="flex:1"></span>
    <span style="display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.32);font-size:10px;font-weight:700;color:#b45309">
      <span style="width:5px;height:5px;border-radius:50%;background:#d97706;animation:sthirPulse 2.4s infinite"></span>{{ t.demoChip }}
    </span>
    <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(15,23,42,.05);border:1px solid #E5E7EB">
      <button onClick="{{ setEn }}" style="border:0;cursor:pointer;padding:5px 12px;border-radius:999px;font:600 12px/1 Inter,sans-serif;background:{{ enBg }};color:{{ enFg }}">English</button>
      <button onClick="{{ setTa }}" style="border:0;cursor:pointer;padding:5px 12px;border-radius:999px;font:600 12px/1 'Noto Sans Tamil',sans-serif;background:{{ taBg }};color:{{ taFg }}">தமிழ்</button>
      <button onClick="{{ setHi }}" style="border:0;cursor:pointer;padding:5px 12px;border-radius:999px;font:600 12px/1 'Noto Sans Devanagari',sans-serif;background:{{ hiBg }};color:{{ hiFg }}">हिन्दी</button>
    </div>
    <button onClick="{{ reset }}" title="Reset demo" style="border:1px solid #D1D5DB;background:#FFFFFF;color:#64748B;cursor:pointer;padding:6px 11px;border-radius:999px;font:600 12px/1 Inter,sans-serif">↺</button>
  </header>

  <!-- worker picker (no worker selected) -->
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:64px 28px;animation:sthirRise .35s ease both">
      <div style="font-size:34px;font-weight:800;letter-spacing:-.025em">{{ t.homeHead }}</div>
      <div style="margin-top:10px;max-width:560px;text-align:center;font-size:14.5px;line-height:1.6;color:#334155;text-wrap:pretty">{{ t.homeSub }}</div>
      <div style="margin-top:40px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center">
        <sc-for list="{{ workers }}" as="w" hint-placeholder-count="3">
          <button onClick="{{ w.open }}" style="width:300px;text-align:left;cursor:pointer;padding:24px;border-radius:12px;border:1px solid #E5E7EB;background:#FFFFFF;color:#0F172A;font-family:inherit" style-hover="border-color:rgba(15,118,110,.45)">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div style="width:72px;height:72px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:{{ w.tint }};border:1px solid {{ w.ring }}">
                <span style="font-size:24px;font-weight:800;color:{{ w.color }};font-variant-numeric:tabular-nums">{{ w.score }}</span>
                <span style="font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#64748B">score</span>
              </div>
              <sc-if value="{{ w.hasAlerts }}" hint-placeholder-val="{{ true }}">
                <span style="padding:3px 9px;border-radius:999px;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.35);font-size:10.5px;font-weight:700;color:#DC2626">{{ w.alertLabel }}</span>
              </sc-if>
            </div>
            <div style="margin-top:16px;font-size:18px;font-weight:800;letter-spacing:-.01em">{{ w.name }}</div>
            <div style="margin-top:3px;font-size:13px;color:#475569">{{ w.occ }} · {{ w.city }}</div>
            <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
              <div style="flex:1;height:6px;border-radius:999px;background:rgba(15,23,42,.08);overflow:hidden">
                <div style="height:100%;width:{{ w.pct }};border-radius:999px;background:{{ w.color }}"></div>
              </div>
              <span style="font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:{{ w.color }}">{{ w.bandLabel }}</span>
            </div>
          </button>
        </sc-for>
      </div>
      <div style="margin-top:40px;max-width:640px;padding:16px 20px;border-radius:12px;border:1px dashed rgba(15,23,42,.18);background:#FFFFFF;font-size:12.5px;line-height:1.6;color:#475569;text-align:center;text-wrap:pretty">{{ t.homeNote }}</div>
    </div>
  </sc-if>

  <!-- app shell (worker selected) -->
  <sc-if value="{{ inApp }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;align-items:stretch;max-width:1360px;width:100%;margin:0 auto">

      <aside style="flex:none;width:264px;padding:24px 16px 24px 28px;display:flex;flex-direction:column;gap:6px">
        <div style="padding:16px;border-radius:12px;border:1px solid #E5E7EB;background:#FFFFFF;margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:{{ bandTint }};border:1px solid {{ bandRing }};font-size:17px;font-weight:800;color:{{ bandColor }};font-variant-numeric:tabular-nums">{{ score }}</div>
            <div style="min-width:0">
              <div style="font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ wName }}</div>
              <div style="font-size:11px;color:#475569">{{ wOcc }}</div>
            </div>
          </div>
          <button onClick="{{ reset }}" style="margin-top:12px;width:100%;cursor:pointer;padding:8px;border-radius:8px;border:1px solid #E5E7EB;background:rgba(15,23,42,.04);color:#334155;font:600 11.5px inherit">{{ t.switchWorker }}</button>
        </div>
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="7">
          <button onClick="{{ n.go }}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;padding:11px 14px;border:0;border-left:3px solid {{ n.border }};border-radius:0 6px 6px 0;background:{{ n.bg }};color:{{ n.fg }};font:{{ n.weight }} 13.5px/1.2 inherit">
          <span style="flex:1">{{ n.label }}</span>
          <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}">
            <span style="flex:none;min-width:18px;text-align:center;padding:2px 6px;border-radius:999px;background:rgba(220,38,38,.12);color:#DC2626;font:700 10.5px inherit">{{ n.badge }}</span>
          </sc-if>
          </button>
        </sc-for>
        <span style="flex:1"></span>
        <button onClick="{{ goCrisis }}" style="cursor:pointer;padding:15px;border-radius:8px;border:1.5px solid #DC2626;background:transparent;color:#DC2626;font:800 14px/1.2 inherit;transition:background .15s,color .15s" style-hover="background:#DC2626;color:#FFFFFF">{{ t.nav.crisis }}</button>
      </aside>

      <main style="flex:1;min-width:0;padding:24px 28px 48px 16px;animation:sthirRise .3s ease both">
        <div style="padding:2px 4px 18px">
          <div style="font-size:24px;font-weight:800;letter-spacing:-.02em">{{ screenTitle }}</div>
          <div style="margin-top:4px;font-size:13px;color:#475569">{{ screenSub }}</div>
        </div>
        <dc-import name="Sthir Worker Screens" api="{{ api }}" hint-size="100%,900px"></dc-import>
      </main>
    </div>
  </sc-if>

  <div style="padding:18px;text-align:center;font-size:11.5px;color:#64748B">All money movement is a prototype simulation. No real funds move.</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1360&quot;,&quot;height&quot;:&quot;960&quot;}}">
const STR = {
  en: { demoChip:'Demo · simulated funds', homeHead:'Who is using Sthir?', homeSub:'Pick a worker to open their resilience dashboard. Three demo profiles, three very different weeks.', homeNote:'Sthir verifies proof of income, scores financial resilience, warns before a cash crisis, and routes emergencies to free government cover before any loan.',
       bands:{critical:'Critical',fragile:'Fragile',building:'Building',resilient:'Resilient'}, alerts:'alerts', switchWorker:'Switch worker',
       nav:{ dashboard:'Dashboard', alerts:'Early warnings', income:'Income history', submit:'Submit income', advance:'Request advance', savings:'Savings', entitle:'Free government cover', crisis:'I have an emergency' },
       subs:{ dashboard:'Resilience, runway and what moves them', alerts:'Graded actions, cheapest and safest first', income:'Every rupee, with how it was verified', submit:'A payout screenshot or invoice photo is enough', advance:'Taken against verified income only', savings:'Swept automatically from each verified payout', entitle:'Schemes you already qualify for — borrowing comes last', crisis:'Free cover is checked before any loan' } },
  ta: { demoChip:'டெமோ · உருவகப் பணம்', homeHead:'ஸ்திரை யார் பயன்படுத்துகிறார்?', homeSub:'ஒரு தொழிலாளியைத் தேர்ந்தெடுத்து அவரது நிதி நிலைத்தன்மை டாஷ்போர்டைத் திறக்கவும்.', homeNote:'ஸ்திர் வருமானச் சான்றை சரிபார்க்கிறது, நிதி நிலைத்தன்மையை மதிப்பிடுகிறது, பணப் பிரச்சினைக்கு முன்பே எச்சரிக்கிறது, அவசர நிலையில் கடனுக்கு முன் இலவச அரசு உதவிக்கு வழிகாட்டுகிறது.',
       bands:{critical:'மிக மோசம்',fragile:'பலவீனம்',building:'வளர்ச்சி',resilient:'நிலையானது'}, alerts:'எச்சரிக்கை', switchWorker:'தொழிலாளியை மாற்று',
       nav:{ dashboard:'டாஷ்போர்டு', alerts:'முன்னெச்சரிக்கை', income:'வருமான வரலாறு', submit:'வருமானம் சமர்ப்பிக்க', advance:'முன்பணம் கேட்க', savings:'சேமிப்பு', entitle:'இலவச அரசு உதவி', crisis:'எனக்கு அவசரம்' },
       subs:{ dashboard:'நிலைத்தன்மை, நீடிப்பு மற்றும் காரணிகள்', alerts:'பாதுகாப்பான நடவடிக்கைகள் முதலில்', income:'ஒவ்வொரு ரூபாயும், சரிபார்ப்புடன்', submit:'ஸ்கிரீன்ஷாட் அல்லது இன்வாய்ஸ் புகைப்படம் போதும்', advance:'சரிபார்க்கப்பட்ட வருமானத்திற்கு எதிராக மட்டும்', savings:'ஒவ்வொரு வரவிலிருந்தும் தானாக சேமிப்பு', entitle:'நீங்கள் தகுதியுள்ள திட்டங்கள் — கடன் கடைசி', crisis:'கடனுக்கு முன் இலவச உதவி சரிபார்க்கப்படும்' } },
  hi: { demoChip:'डेमो · नकली धनराशि', homeHead:'स्थिर कौन उपयोग कर रहा है?', homeSub:'किसी कामगार को चुनें और उनका वित्तीय मज़बूती डैशबोर्ड खोलें।', homeNote:'स्थिर आय का प्रमाण जाँचता है, वित्तीय मज़बूती आँकता है, नकदी संकट से पहले चेतावनी देता है, और आपात स्थिति में कर्ज़ से पहले मुफ़्त सरकारी कवर तक पहुँचाता है।',
       bands:{critical:'गंभीर',fragile:'कमज़ोर',building:'बनते हुए',resilient:'मज़बूत'}, alerts:'चेतावनी', switchWorker:'कामगार बदलें',
       nav:{ dashboard:'डैशबोर्ड', alerts:'पूर्व चेतावनी', income:'आय इतिहास', submit:'आय जमा करें', advance:'एडवांस माँगें', savings:'बचत', entitle:'मुफ़्त सरकारी कवर', crisis:'मेरी आपात स्थिति है' },
       subs:{ dashboard:'मज़बूती, टिकाव और उनके कारण', alerts:'सुरक्षित और सस्ते उपाय पहले', income:'हर रुपया, जाँच के साथ', submit:'स्क्रीनशॉट या इनवॉइस फ़ोटो काफ़ी है', advance:'केवल सत्यापित आय के विरुद्ध', savings:'हर भुगतान से अपने-आप जमा', entitle:'जिन योजनाओं के आप पात्र हैं — कर्ज़ आख़िर में', crisis:'कर्ज़ से पहले मुफ़्त कवर की जाँच' } },
};

const BAND = {
  critical:  { color:'#DC2626', tint:'rgba(220,38,38,.12)', ring:'rgba(220,38,38,.35)' },
  fragile:   { color:'#b45309', tint:'rgba(217,119,6,.12)', ring:'rgba(217,119,6,.35)' },
  building:  { color:'#0f766e', tint:'rgba(15,118,110,.12)', ring:'rgba(15,118,110,.35)' },
  resilient: { color:'#15803d', tint:'rgba(21,128,61,.12)', ring:'rgba(21,128,61,.35)' },
};

const WORKERS = [
  { id:'w1', name:'Murugan S.', occ:{en:'Delivery rider',ta:'டெலிவரி ரைடர்',hi:'डिलीवरी राइडर'}, city:{en:'Chennai',ta:'சென்னை',hi:'चेन्नई'}, score:34, band:'critical', openAlerts:3, runway:6 },
  { id:'w2', name:'Lakshmi R.', occ:{en:'Tailor',ta:'தையல்காரர்',hi:'दर्ज़ी'}, city:{en:'Coimbatore',ta:'கோயம்புத்தூர்',hi:'कोयंबटूर'}, score:58, band:'fragile', openAlerts:1, runway:19 },
  { id:'w3', name:'Arun Kumar', occ:{en:'Freelance designer',ta:'ஃப்ரீலான்ஸ் வடிவமைப்பாளர்',hi:'फ्रीलांस डिज़ाइनर'}, score:76, city:{en:'Madurai',ta:'மதுரை',hi:'मदुरै'}, band:'resilient', openAlerts:0, runway:47 },
];

/**
 * Sthir Worker — application shell (routing, locale, worker session).
 * Screen content renders in the child DC "Sthir Worker Screens" via the ShellApi contract.
 *
 * @typedef {'en'|'ta'|'hi'} LocaleCode
 * @typedef {'dashboard'|'alerts'|'income'|'submit'|'advance'|'savings'|'entitle'|'crisis'} ScreenKey
 */
const deepFreeze = obj => {
  if (obj && typeof obj === 'object' && !Object.isFrozen(obj)) { Object.freeze(obj); Object.values(obj).forEach(deepFreeze); }
  return obj;
};
[STR, BAND, WORKERS].forEach(deepFreeze);

/** Ordered sidebar navigation. Crisis is intentionally excluded: it renders as the pinned emergency action. */
const SIDEBAR_SCREEN_KEYS = deepFreeze(['dashboard','alerts','income','submit','advance','savings','entitle']);

/** @param {boolean} isActive @returns {{bg: string, fg: string}} */
const getLanguagePillStyle = isActive => ({ bg: isActive ? '#0f766e' : 'transparent', fg: isActive ? '#FFFFFF' : '#475569' });

class Component extends DCLogic {
  /** @type {{ lang: LocaleCode, screen: ScreenKey, workerId: (string|null) }} */
  state = { lang:'en', screen:'dashboard', workerId:null };

  /** @param {LocaleCode} lang */
  setLang = lang => { if (STR[lang]) this.setState({ lang }); };
  /** @param {ScreenKey} screen */
  go = screen => { if (typeof screen === 'string') this.setState({ screen }); };
  resetSession = () => this.setState({ workerId:null, screen:'dashboard' });

  /** Memo cache: worker-picker cards depend only on locale. */
  workerCardCache = { lang: null, cards: null };
  getWorkerCards(lang, t) {
    if (this.workerCardCache.lang === lang) return this.workerCardCache.cards;
    const cards = WORKERS.map(worker => {
      const band = BAND[worker.band];
      return { ...worker, occ:worker.occ[lang], city:worker.city[lang], color:band.color, tint:band.tint, ring:band.ring,
        pct: worker.score + '%', bandLabel: t.bands[worker.band], hasAlerts: worker.openAlerts > 0,
        alertLabel: worker.openAlerts + ' ' + t.alerts,
        open: () => this.setState({ workerId:worker.id, screen:'dashboard' }) };
    });
    this.workerCardCache = { lang, cards };
    return cards;
  }

  renderVals() {
    const { lang, screen, workerId } = this.state;
    const t = STR[lang];
    const en = getLanguagePillStyle(lang==='en'), ta = getLanguagePillStyle(lang==='ta'), hi = getLanguagePillStyle(lang==='hi');
    const w = WORKERS.find(worker => worker.id === workerId) || null;
    const b = w ? BAND[w.band] : BAND.building;
    const keys = SIDEBAR_SCREEN_KEYS;
    return {
      t, isHome: !workerId, inApp: !!workerId,
      enBg:en.bg, enFg:en.fg, taBg:ta.bg, taFg:ta.fg, hiBg:hi.bg, hiFg:hi.fg,
      setEn:()=>this.setLang('en'), setTa:()=>this.setLang('ta'), setHi:()=>this.setLang('hi'),
      reset: this.resetSession,
      goCrisis: () => this.go('crisis'),
      workers: this.getWorkerCards(lang, t),
      wName: w ? w.name : '', wOcc: w ? w.occ[lang] : '', score: w ? w.score : '',
      bandColor:b.color, bandTint:b.tint, bandRing:b.ring,
      navItems: keys.map(k => ({
        label: t.nav[k], go: () => this.go(k),
        bg: 'transparent',
        border: screen === k ? '#0f766e' : 'transparent',
        fg: screen === k ? '#0f766e' : '#475569',
        weight: screen === k ? 800 : 600,
        hasBadge: k === 'alerts' && w && w.openAlerts > 0,
        badge: w ? w.openAlerts : 0,
      })),
      screenTitle: t.nav[screen === 'entitlements' ? 'entitle' : screen] || t.nav.dashboard,
      screenSub: t.subs[screen === 'entitlements' ? 'entitle' : screen] || '',
      api: { lang, screen, workerId, go:this.go },
    };
  }
}

</script>
</body>
</html>
