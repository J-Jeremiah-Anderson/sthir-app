<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sthir · Lender console</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  body[data-theme="light"] {
    --bg:#F3EDE1; --panel:#FFFDF8; --panel2:#F6EFE2; --line:#E5DAC7; --line2:#EDE6D6;
    --fg:#241E17; --fg2:#6A5D4E; --fg3:#A79A88; --accent:#2E5A87; --accentSoft:#E3EBF3;
    --pos:#3E7C4F; --posSoft:#E4EEE2; --warn:#A9721E; --warnSoft:#F4E9D2; --neg:#B23A2C; --negSoft:#F3E2DA;
    --info:#5C83B6; --active:#233150; --activeIcon:#5C83B6; --shadow:0 1px 2px rgba(90,60,30,.06), 0 10px 26px -20px rgba(90,60,30,.32);
  }
  body[data-theme="dark"] {
    --bg:#0E1626; --panel:#172032; --panel2:#141B29; --line:#26324A; --line2:#1E2739;
    --fg:#E2E8F0; --fg2:#94a3b8; --fg3:#64748b; --accent:#5BA4CF; --accentSoft:#1B2C40;
    --pos:#34d399; --posSoft:#0f2a1e; --warn:#F5C563; --warnSoft:#2B2113; --neg:#f87171; --negSoft:#2c1715;
    --info:#7EC8E3; --active:#5BA4CF; --activeIcon:#0E1626; --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 40px -26px rgba(0,0,0,.9);
  }
  button { font-family:inherit; }
  @keyframes sthirIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  *::-webkit-scrollbar { width:10px; height:10px; } *::-webkit-scrollbar-thumb { background:var(--line); border-radius:6px; }
</style>
</head>
<body data-theme="light">
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script type="module">
import htm from 'https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.module.js';
const { useState, useEffect, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

const API = (window.STHIR_API || '') + '/api';
async function api(path, opts) { const r = await fetch(API+path, opts); if(!r.ok) throw new Error(path+' '+r.status); return r.status===204?null:r.json(); }
const fmt = n => { const x=Number(n); return Number.isFinite(x)?'₹'+Math.round(x).toLocaleString('en-IN'):'₹—'; };
const BANDC = { critical:'var(--neg)', fragile:'var(--warn)', building:'var(--info)', resilient:'var(--pos)' };
const BANDLBL = { critical:'Critical', fragile:'Fragile', building:'Building', resilient:'Resilient' };
const gradeColor = g => g==='A'?'var(--pos)':g==='B'?'var(--info)':g==='C'?'var(--warn)':'var(--neg)';
const evStyle = t => {
  if(t.startsWith('advance.refused')) return {label:'refusal', color:'var(--neg)', soft:'var(--negSoft)'};
  if(t.startsWith('advance')) return {label:'advance', color:'var(--pos)', soft:'var(--posSoft)'};
  if(t.startsWith('income')||t.startsWith('verify')) return {label:'verify', color:'var(--info)', soft:'var(--accentSoft)'};
  if(t.startsWith('crisis')) return {label:'crisis', color:'var(--accent)', soft:'var(--accentSoft)'};
  if(t.startsWith('source')||t.includes('flag')) return {label:'flag', color:'var(--warn)', soft:'var(--warnSoft)'};
  if(t.startsWith('allocation')) return {label:'alloc', color:'var(--fg2)', soft:'var(--panel2)'};
  return {label:t.split('.')[0].slice(0,7), color:'var(--fg2)', soft:'var(--panel2)'};
};

const Panel = ({children, style}) => html`<div style=${{padding:18,borderRadius:14,border:'1px solid var(--line)',background:'var(--panel)',boxShadow:'var(--shadow)',...(style||{})}}>${children}</div>`;
const Th = ({children, align}) => html`<th style=${{textAlign:align||'left',padding:'9px 12px',fontSize:10.5,fontWeight:600,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)',borderBottom:'1px solid var(--line)'}}>${children}</th>`;

/* ---------------- Portfolio ---------------- */
function Portfolio({ data }) {
  if(!data) return null;
  const bands = ['critical','fragile','building','resilient'].map(k=>({key:k,label:BANDLBL[k],count:data.resilience_bands[k]||0,color:BANDC[k]}));
  const maxB = Math.max(1,...bands.map(b=>b.count));
  const kpis = [
    {label:'Workers', value:data.workers, note:'in portfolio', color:'var(--fg)'},
    {label:'Distress cases', value:(data.distress_cases||[]).length, note:'needing intervention', color:'var(--neg)'},
    {label:'Advances outstanding', value:fmt(data.advances_value), note:data.advances_disbursed+' disbursed', color:'var(--fg)'},
    {label:'Protective refusals', value:data.advances_refused_protectively, note:'responsible-lending control', color:'var(--warn)'},
    {label:'Fraud rings', value:(data.fraud_rings||[]).length, note:'perceptual-hash matches', color:'var(--accent)'},
  ];
  return html`
  <div style=${{display:'flex',flexDirection:'column',gap:20}}>
    <div style=${{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(196px,1fr))',gap:12}}>
      ${kpis.map((k,i)=>html`<${Panel} key=${i} style=${{padding:16}}>
        <div style=${{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--fg3)'}}>${k.label}</div>
        <div style=${{marginTop:10,font:"700 27px/1 'IBM Plex Sans',sans-serif",letterSpacing:'-.03em',fontVariantNumeric:'tabular-nums',color:k.color}}>${k.value}</div>
        <div style=${{marginTop:7,fontSize:11.5,color:'var(--fg2)'}}>${k.note}</div>
      <//>`)}
    </div>
    <div style=${{display:'grid',gridTemplateColumns:'1.15fr .85fr',gap:16}}>
      <${Panel}>
        <div style=${{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
          <div style=${{fontSize:13,fontWeight:700}}>Resilience band distribution</div>
          <div style=${{font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>n = ${data.workers}</div>
        </div>
        <div style=${{marginTop:20,display:'flex',alignItems:'flex-end',gap:18,height:190,padding:'0 6px',borderBottom:'1px solid var(--line)'}}>
          ${bands.map((b,i)=>html`<div key=${i} style=${{flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',alignItems:'center',height:'100%',gap:8}}>
            <div style=${{font:"600 12px 'IBM Plex Mono',monospace",fontVariantNumeric:'tabular-nums',color:b.color}}>${b.count}</div>
            <div style=${{width:'100%',height:(b.count/maxB*100)+'%',minHeight:4,borderRadius:'5px 5px 0 0',background:b.color,opacity:.9}}></div>
          </div>`)}
        </div>
        <div style=${{display:'flex',gap:18,padding:'10px 6px 0'}}>
          ${bands.map((b,i)=>html`<div key=${i} style=${{flex:1,textAlign:'center',fontSize:11.5,fontWeight:600,color:'var(--fg2)'}}>${b.label}<span style=${{display:'block',font:"400 10.5px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${data.workers?Math.round(b.count/data.workers*100):0}%</span></div>`)}
        </div>
      <//>
      <${Panel}>
        <div style=${{fontSize:13,fontWeight:700}}>Protective refusals</div>
        <div style=${{marginTop:6,fontSize:11.5,lineHeight:1.5,color:'var(--fg2)'}}>Advances the system declined to keep a borrower out of a debt spiral. Reported as a responsible-lending control, not a rejection.</div>
        <div style=${{marginTop:22,display:'flex',alignItems:'baseline',gap:10}}>
          <span style=${{font:"700 44px 'IBM Plex Mono',monospace",color:'var(--warn)',fontVariantNumeric:'tabular-nums'}}>${data.advances_refused_protectively}</span>
          <span style=${{fontSize:12.5,color:'var(--fg2)'}}>refused to protect the borrower</span>
        </div>
        <div style=${{marginTop:18,paddingTop:14,borderTop:'1px solid var(--line)',fontSize:12,color:'var(--fg2)',lineHeight:1.6}}>
          Every refusal routes the worker to a cheaper alternative — most often refinancing high-APR informal debt rather than stacking a new advance on top of it.
        </div>
      <//>
    </div>
  </div>`;
}

/* ---------------- Distress ---------------- */
function Distress({ cases, onWorker }) {
  const [sel, setSel] = useState(0);
  const [ladder, setLadder] = useState(null);
  const list = cases||[];
  const c = list[sel];
  useEffect(()=>{ if(!c){setLadder(null);return;} setLadder(null); api(`/workers/${c.worker_id}/alerts`).then(a=>{ const top=(a||[])[0]; setLadder(top&&top.intervention?top.intervention.ladder:[]); }).catch(()=>setLadder([])); },[c&&c.worker_id]);
  if(!list.length) return html`<${Panel}><div style=${{color:'var(--fg2)'}}>No distress cases — portfolio is healthy.</div><//>`;
  return html`
  <div style=${{display:'grid',gridTemplateColumns:'1.5fr 1fr',gap:16,alignItems:'start'}}>
    <div style=${{borderRadius:10,border:'1px solid var(--line)',background:'var(--panel)',boxShadow:'var(--shadow)',overflow:'hidden'}}>
      <div style=${{padding:'14px 16px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
        <div style=${{fontSize:13,fontWeight:700}}>Triage queue</div>
        <div style=${{font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${list.length} open</div>
      </div>
      <div style=${{overflowX:'auto'}}>
        <table style=${{width:'100%',borderCollapse:'collapse',fontSize:12.5,minWidth:560}}>
          <thead><tr style=${{background:'var(--panel2)'}}><${Th}>Worker<//><${Th}>Top alert<//><${Th} align="right">Runway<//><${Th}>Occupation<//></tr></thead>
          <tbody>
            ${list.map((r,i)=>{ const col=r.resilience_score<30?'var(--neg)':r.resilience_score<55?'var(--warn)':'var(--info)'; const active=i===sel; return html`
              <tr key=${i} onClick=${()=>setSel(i)} style=${{cursor:'pointer',background:active?'var(--panel2)':'transparent',borderBottom:'1px solid var(--line2)'}}>
                <td style=${{padding:'11px 12px'}}><div style=${{display:'flex',alignItems:'center',gap:9}}>
                  <span style=${{flex:'none',width:26,height:26,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--panel2)',border:'1px solid var(--line)',font:"600 11px 'IBM Plex Mono',monospace",color:col}}>${r.resilience_score}</span>
                  <span style=${{fontWeight:600}}>${r.name}</span></div></td>
                <td style=${{padding:'11px 12px',color:'var(--fg2)'}}>${r.top_alert}</td>
                <td style=${{padding:'11px 12px',textAlign:'right',font:"600 12.5px 'IBM Plex Mono',monospace",color:col}}>${Math.round(r.runway_days)}d</td>
                <td style=${{padding:'11px 12px',color:'var(--fg3)'}}>${r.occupation}</td>
              </tr>`; })}
          </tbody>
        </table>
      </div>
    </div>
    <${Panel} style=${{position:'sticky',top:92}}>
      <div style=${{fontSize:17,fontWeight:700,letterSpacing:'-.015em'}}>${c.name}</div>
      <div style=${{marginTop:2,fontSize:12,color:'var(--fg2)'}}>${c.occupation}</div>
      <div style=${{marginTop:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div style=${{padding:11,borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)'}}><div style=${{fontSize:10,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)'}}>Score</div><div style=${{marginTop:4,font:"700 18px 'IBM Plex Mono',monospace",color:c.resilience_score<30?'var(--neg)':'var(--warn)'}}>${c.resilience_score}</div></div>
        <div style=${{padding:11,borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)'}}><div style=${{fontSize:10,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)'}}>Runway</div><div style=${{marginTop:4,font:"700 18px 'IBM Plex Mono',monospace"}}>${Math.round(c.runway_days)}d</div></div>
      </div>
      <div style=${{marginTop:18,fontSize:11,fontWeight:600,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)'}}>Recommended intervention ladder</div>
      <div style=${{marginTop:10,display:'flex',flexDirection:'column',gap:7}}>
        ${ladder===null?html`<div style=${{color:'var(--fg3)',fontSize:12}}>Loading…</div>`:
          ladder.length?ladder.map((s,i)=>html`<div key=${i} style=${{display:'flex',gap:9,padding:'10px 11px',borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)',fontSize:12.5,lineHeight:1.45}}>
            <span style=${{flex:'none',font:"600 11px 'IBM Plex Mono',monospace",color:'var(--accent)'}}>${i+1}</span>
            <span style=${{flex:1,color:'var(--fg2)'}}>${s.label}</span></div>`):html`<div style=${{color:'var(--fg3)',fontSize:12}}>No ladder.</div>`}
      </div>
      <button onClick=${()=>onWorker(c.worker_id)} style=${{marginTop:16,width:'100%',cursor:'pointer',padding:10,borderRadius:8,border:'1px solid var(--line)',background:'var(--panel2)',color:'var(--fg)',font:'600 12px inherit'}}>Open worker (read-only)</button>
    <//>
  </div>`;
}

/* ---------------- Sources ---------------- */
function Sources({ sources, onFlag }) {
  if(!sources) return null;
  return html`
  <div style=${{borderRadius:10,border:'1px solid var(--line)',background:'var(--panel)',boxShadow:'var(--shadow)',overflow:'hidden'}}>
    <div style=${{padding:'14px 16px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
      <div style=${{fontSize:13,fontWeight:700}}>Who pays your borrowers, and how reliably</div>
      <div style=${{font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>2 flags = amber · reputation shared across workers</div>
    </div>
    <div style=${{overflowX:'auto'}}>
      <table style=${{width:'100%',borderCollapse:'collapse',fontSize:12.5,minWidth:820}}>
        <thead><tr style=${{background:'var(--panel2)'}}><${Th}>Source<//><${Th}>Type<//><${Th} align="center">Grade<//><${Th} align="right">Avg days late<//><${Th} align="right">Payments<//><${Th} align="center">Flags<//><${Th}>Note<//><${Th}><//></tr></thead>
        <tbody>
          ${sources.map((s,i)=>{ const flags=(s.flagged_by_workers||[]).length; const fc=flags>=2?'var(--warn)':'var(--fg2)'; return html`
            <tr key=${i} style=${{borderBottom:'1px solid var(--line2)'}}>
              <td style=${{padding:'11px 12px',fontWeight:600}}>${s.name}</td>
              <td style=${{padding:'11px 12px',color:'var(--fg2)'}}>${(s.kind||'').replace(/_/g,' ')}</td>
              <td style=${{padding:'11px 12px',textAlign:'center'}}><span style=${{display:'inline-flex',width:24,height:24,alignItems:'center',justifyContent:'center',borderRadius:6,background:'var(--panel2)',border:'1px solid var(--line)',font:"600 12px 'IBM Plex Mono',monospace",color:gradeColor(s.grade)}}>${s.grade}</span></td>
              <td style=${{padding:'11px 12px',textAlign:'right',font:"500 12.5px 'IBM Plex Mono',monospace",fontVariantNumeric:'tabular-nums'}}>${(s.avg_days_late||0).toFixed(1)}</td>
              <td style=${{padding:'11px 12px',textAlign:'right',font:"400 12.5px 'IBM Plex Mono',monospace",color:'var(--fg2)'}}>${s.payments_observed}</td>
              <td style=${{padding:'11px 12px',textAlign:'center',font:"600 12px 'IBM Plex Mono',monospace",color:fc}}>${flags}</td>
              <td style=${{padding:'11px 12px',color:'var(--fg2)',maxWidth:240}}>${s.note}</td>
              <td style=${{padding:'11px 12px',textAlign:'right'}}><button onClick=${()=>onFlag(s.id)} style=${{cursor:'pointer',padding:'6px 10px',borderRadius:6,border:'1px solid var(--line)',background:'var(--panel2)',color:'var(--fg2)',font:'600 11px inherit'}}>Flag</button></td>
            </tr>`; })}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ---------------- Verification / fraud ---------------- */
function Fraud({ tierMix, rings }) {
  const total = tierMix ? tierMix.reduce((s,t)=>s+t.n,0) : 0;
  return html`
  <div style=${{display:'flex',flexDirection:'column',gap:16}}>
    <${Panel}>
      <div style=${{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
        <div style=${{fontSize:13,fontWeight:700}}>Verification tier mix · live</div>
        <div style=${{font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${total} income events</div>
      </div>
      <div style=${{marginTop:16,display:'flex',height:14,borderRadius:4,overflow:'hidden',border:'1px solid var(--line2)'}}>
        ${(tierMix||[]).map((t,i)=>html`<div key=${i} style=${{width:(total?t.n/total*100:0)+'%',background:t.color}}></div>`)}
      </div>
      <div style=${{marginTop:14,display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        ${(tierMix||[]).map((t,i)=>html`<div key=${i} style=${{padding:12,borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)'}}>
          <div style=${{display:'flex',alignItems:'center',gap:8}}>
            <span style=${{width:9,height:9,borderRadius:2,background:t.color}}></span>
            <span style=${{font:"600 12px 'IBM Plex Mono',monospace",color:t.color}}>Tier ${t.tier}</span>
            <span style=${{marginLeft:'auto',font:"600 13px 'IBM Plex Mono',monospace",fontVariantNumeric:'tabular-nums'}}>${total?Math.round(t.n/total*100):0}%</span>
          </div>
          <div style=${{marginTop:7,fontSize:12,color:'var(--fg2)'}}>${t.label}</div>
          <div style=${{marginTop:3,font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${t.n} events</div>
        </div>`)}
      </div>
    <//>
    <${Panel}>
      <div style=${{fontSize:13,fontWeight:700}}>Fraud rings detected</div>
      ${(rings&&rings.length)?html`<div style=${{marginTop:12,display:'flex',flexDirection:'column',gap:10}}>
        ${rings.map((r,i)=>html`<div key=${i} style=${{padding:14,borderRadius:10,border:'1px solid var(--line)',background:'var(--panel2)'}}>
          <div style=${{display:'flex',justifyContent:'space-between'}}><span style=${{fontWeight:700}}>${r.label||('Ring '+(i+1))}</span><span style=${{font:"600 12.5px 'IBM Plex Mono',monospace",color:'var(--neg)'}}>${fmt(r.amount||0)}</span></div>
          <div style=${{marginTop:6,fontSize:11.5,color:'var(--fg2)'}}>${r.method||r.detail||''}</div>
        </div>`)}
      </div>`:html`
        <div style=${{marginTop:12,padding:16,borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)',fontSize:12.5,color:'var(--fg2)',lineHeight:1.6}}>
          No duplicate or re-photographed invoices in the current seed. The detector runs a 255-bit perceptual hash on every submitted image; a match under the distance threshold opens a ring here for side-by-side review.
        </div>`}
      <div style=${{marginTop:14,padding:'11px 12px',borderRadius:8,background:'var(--warnSoft)',border:'1px solid var(--warn)',fontSize:11.5,lineHeight:1.5,color:'var(--warn)'}}>Demonstration of the matching mechanism on seeded data. Not a claim about any real entity.</div>
    <//>
  </div>`;
}

/* ---------------- Exposure ---------------- */
function Exposure({ invoices, sel, setSel }) {
  const [exp, setExp] = useState(null);
  const inv = invoices && invoices[sel];
  useEffect(()=>{ if(!inv){setExp(null);return;} setExp(null); api(`/income/${inv.id}/exposure`).then(setExp).catch(()=>setExp({__err:true})); },[inv&&inv.id]);
  if(!invoices||!invoices.length) return html`<${Panel}><div style=${{color:'var(--fg2)'}}>No overdue invoices in the portfolio right now.</div><//>`;
  return html`
  <div style=${{display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:16,alignItems:'start',maxWidth:1180}}>
    <${Panel} style=${{padding:20}}>
      <div style=${{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
        ${invoices.map((v,i)=>html`<button key=${i} onClick=${()=>setSel(i)} style=${{cursor:'pointer',padding:'6px 10px',borderRadius:6,border:'1px solid '+(i===sel?'var(--accent)':'var(--line)'),background:i===sel?'var(--accentSoft)':'var(--panel2)',color:i===sel?'var(--accent)':'var(--fg2)',font:'600 11.5px inherit'}}>${v.source_name||v.reference}</button>`)}
      </div>
      <div style=${{font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${inv.reference}</div>
      <div style=${{marginTop:8,fontSize:19,fontWeight:700,letterSpacing:'-.02em'}}>Why ${inv.source_name||'the buyer'} should pay on time</div>
      <div style=${{marginTop:6,fontSize:12.5,color:'var(--fg2)'}}>${fmt(inv.gross)} · ${inv.kind.replace(/_/g,' ')}</div>
      <div style=${{marginTop:18,display:'flex',flexDirection:'column',gap:9}}>
        ${['Payment past the 45-day MSMED s.16 ceiling accrues statutory interest at 3× the RBI bank rate, automatically.','The interest applies whether or not the supplier asks for it.','Under s.43B(h) the buyer cannot deduct this expense until it is actually paid — pushing tax into this assessment year.'].map((p,i)=>html`
          <div key=${i} style=${{display:'flex',gap:10,padding:12,borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)',fontSize:12.5,lineHeight:1.5,color:'var(--fg2)'}}><span style=${{flex:'none',color:'var(--accent)',fontWeight:700}}>§</span><span>${p}</span></div>`)}
      </div>
    <//>
    <${Panel} style=${{padding:20}}>
      <div style=${{fontSize:11,fontWeight:600,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)'}}>Buyer's exposure today</div>
      ${exp&&!exp.__err?html`<div style=${{marginTop:16,display:'flex',flexDirection:'column',gap:12}}>
        <div style=${{display:'flex',alignItems:'baseline',justifyContent:'space-between',paddingBottom:12,borderBottom:'1px solid var(--line2)'}}>
          <span style=${{fontSize:12.5,color:'var(--fg2)'}}>s.16 interest accrued<span style=${{display:'block',font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${exp.days_late} days late · ${exp.basis||'3× RBI rate'}</span></span>
          <span style=${{font:"600 17px 'IBM Plex Mono',monospace",fontVariantNumeric:'tabular-nums',color:'var(--warn)'}}>${fmt(exp.msmed_interest_accrued)}</span>
        </div>
        <div style=${{display:'flex',alignItems:'baseline',justifyContent:'space-between',paddingBottom:12,borderBottom:'1px solid var(--line2)'}}>
          <span style=${{fontSize:12.5,color:'var(--fg2)'}}>s.43B(h) deduction disallowed<span style=${{display:'block',font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>Tax deferred to the year of payment</span></span>
          <span style=${{font:"600 17px 'IBM Plex Mono',monospace",fontVariantNumeric:'tabular-nums',color:'var(--neg)'}}>${fmt(exp.s43bh_tax_cost_if_unpaid)}</span>
        </div>

/* ---------------- Activity ---------------- */
function Activity({ events }) {
  return html`
  <div style=${{maxWidth:900,borderRadius:10,border:'1px solid var(--line)',background:'var(--panel)',boxShadow:'var(--shadow)',overflow:'hidden'}}>
    <div style=${{padding:'14px 16px',borderBottom:'1px solid var(--line)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style=${{fontSize:13,fontWeight:700}}>Event stream</div>
      <div style=${{display:'flex',alignItems:'center',gap:7,font:"400 11px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}><span style=${{width:6,height:6,borderRadius:'50%',background:'var(--pos)'}}></span>live · polling 4s</div>
    </div>
    <div style=${{maxHeight:620,overflowY:'auto'}}>
      ${(events||[]).map((e,i)=>{ const s=evStyle(e.type); const time=(e.ts||'').slice(11,19);
        const scal=v=> typeof v==='number'?fmt(v): (v&&typeof v==='object')?'':String(v);
        const txt=e.payload&&typeof e.payload==='object'?Object.entries(e.payload).map(([k,v])=>{const sv=scal(v);return sv?k+' '+sv:null;}).filter(Boolean).join(' · '):(e.subject_id||''); return html`
        <div key=${i} style=${{display:'flex',alignItems:'baseline',gap:12,padding:'11px 16px',borderBottom:'1px solid var(--line2)',animation:'sthirIn .3s ease both'}}>
          <span style=${{flex:'none',font:"400 11.5px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${time}</span>
          <span style=${{flex:'none',width:70,padding:'2px 6px',borderRadius:4,background:s.soft,font:"600 10px 'IBM Plex Mono',monospace",color:s.color,textAlign:'center'}}>${s.label}</span>
          <span style=${{flex:1,fontSize:12.5,lineHeight:1.45,color:'var(--fg2)'}}><strong style=${{color:'var(--fg)'}}>${e.type}</strong> · ${txt}</span>
        </div>`; })}
      ${!(events||[]).length?html`<div style=${{padding:20,color:'var(--fg3)',fontSize:12.5}}>No events yet. Actions in the worker portal appear here.</div>`:null}
    </div>
  </div>`;
}

/* ---------------- Worker (read-only) ---------------- */
function WorkerView({ workerId }) {
  const [d, setD] = useState(null); const [al, setAl] = useState(null);
  useEffect(()=>{ setD(null);setAl(null); api(`/workers/${workerId}`).then(setD).catch(()=>{}); api(`/workers/${workerId}/alerts`).then(setAl).catch(()=>setAl([])); },[workerId]);
  if(!d) return html`<${Panel}><div style=${{color:'var(--fg2)'}}>Loading…</div><//>`;
  const r=d.resilience; const col=BANDC[r.resilience_band]; const ladder=(al&&al[0]&&al[0].intervention)?al[0].intervention.ladder:[];
  return html`
  <div style=${{display:'grid',gridTemplateColumns:'.85fr 1.15fr',gap:16,alignItems:'start',maxWidth:1240}}>
    <${Panel} style=${{padding:20}}>
      <div style=${{fontSize:19,fontWeight:700,letterSpacing:'-.02em'}}>${d.name}</div>
      <div style=${{marginTop:3,fontSize:12.5,color:'var(--fg2)'}}>${d.occupation} · ${d.city} · read-only</div>
      <div style=${{marginTop:18,display:'flex',alignItems:'baseline',gap:10}}>
        <span style=${{font:"700 40px 'IBM Plex Mono',monospace",letterSpacing:'-.03em',color:col}}>${r.resilience_score}</span>
        <span style=${{fontSize:12.5,fontWeight:600,color:col}}>${BANDLBL[r.resilience_band]}</span>
      </div>
      <div style=${{marginTop:12,height:8,borderRadius:4,background:'var(--line2)',overflow:'hidden'}}><div style=${{height:'100%',width:r.resilience_score+'%',background:col}}></div></div>
      <div style=${{marginTop:20,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div style=${{padding:12,borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)'}}><div style=${{fontSize:10,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)'}}>Runway</div><div style=${{marginTop:4,font:"700 18px 'IBM Plex Mono',monospace"}}>${Math.round(r.runway_days)} d</div></div>
        <div style=${{padding:12,borderRadius:8,background:'var(--panel2)',border:'1px solid var(--line2)'}}><div style=${{fontSize:10,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)'}}>Debt service</div><div style=${{marginTop:4,font:"700 18px 'IBM Plex Mono',monospace"}}>${fmt(r.obligations.debt_service)}</div></div>
      </div>
      <div style=${{marginTop:20,fontSize:11,fontWeight:600,letterSpacing:'.07em',textTransform:'uppercase',color:'var(--fg3)'}}>Open intervention ladder</div>
      <div style=${{marginTop:9,display:'flex',flexDirection:'column',gap:7}}>
        ${ladder.map((s,i)=>html`<div key=${i} style=${{display:'flex',gap:9,fontSize:12.5,lineHeight:1.45,color:'var(--fg2)'}}><span style=${{flex:'none',font:"600 11px 'IBM Plex Mono',monospace",color:'var(--accent)'}}>${i+1}</span><span>${s.label}</span></div>`)}
      </div>
    <//>
    <div style=${{borderRadius:10,border:'1px solid var(--line)',background:'var(--panel)',boxShadow:'var(--shadow)',overflow:'hidden'}}>
      <div style=${{padding:'14px 16px',borderBottom:'1px solid var(--line)',fontSize:13,fontWeight:700}}>Recent verified income</div>
      <div style=${{overflowX:'auto'}}>
        <table style=${{width:'100%',borderCollapse:'collapse',fontSize:12.5,minWidth:520}}>
          <thead><tr style=${{background:'var(--panel2)'}}><${Th}>Ref<//><${Th}>Date<//><${Th}>Source<//><${Th} align="center">Tier<//><${Th} align="right">Gross<//></tr></thead>
          <tbody>
            ${(d.income_events||[]).map((r2,i)=>html`<tr key=${i} style=${{borderBottom:'1px solid var(--line2)'}}>
              <td style=${{padding:'11px 12px',font:"400 12px 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>${r2.reference}</td>
              <td style=${{padding:'11px 12px',color:'var(--fg2)'}}>${r2.received_date||r2.expected_date}</td>
              <td style=${{padding:'11px 12px',fontWeight:500}}>${r2.source_name||'—'}</td>
              <td style=${{padding:'11px 12px',textAlign:'center',font:"600 12px 'IBM Plex Mono',monospace",color:gradeColor(r2.tier)}}>${r2.tier}</td>
              <td style=${{padding:'11px 12px',textAlign:'right',font:"500 12.5px 'IBM Plex Mono',monospace",fontVariantNumeric:'tabular-nums'}}>${fmt(r2.gross)}</td>
            </tr>`)}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

const NAV = [
  {key:'portfolio',label:'Portfolio'},{key:'distress',label:'Distress caseload'},{key:'sources',label:'Income sources'},
  {key:'fraud',label:'Verification & fraud'},{key:'exposure',label:'Statutory exposure'},{key:'activity',label:'Activity'},

const Icon = ({name, color}) => html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke=${color} stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${(ICON_PATHS[name]||[]).map((d,i)=>html`<path key=${i} d=${d}/>`)}</svg>`;
const TITLES = {

  sources:['Income sources','Shared reliability reputation across all workers'],
  fraud:['Verification & fraud','Tier mix and perceptual-hash duplicate detection'],
  exposure:['Statutory exposure','MSMED s.16 interest + s.43B(h) tax disallowance'],
  activity:['Activity','Live event stream from the engine'],
  worker:['Worker detail','Read-only borrower view'],
};

/* ---------- demo admin login (prototype only) ---------- */
const ADMIN = { id:'admin@sthir.in', pass:'sthir2026' };
function LenderLogin({ onLogin, theme, setTheme }) {
  const [id, setId] = useState(''); const [pass, setPass] = useState(''); const [err, setErr] = useState('');
  const submit = (e) => { if(e&&e.preventDefault) e.preventDefault();
    const u = id.trim().toLowerCase();
    if(u!=='admin' && u!==ADMIN.id){ setErr('Unknown account. Use the demo admin login below.'); return; }
    if(pass!==ADMIN.pass){ setErr('Incorrect password.'); return; }
    setErr(''); onLogin();
  };
  const field = (label, value, set, type, ph) => html`
    <label style=${{display:'block'}}>
      <span style=${{display:'block',fontSize:11,fontWeight:600,letterSpacing:'.04em',color:'var(--fg2)',marginBottom:6}}>${label}</span>
      <input value=${value} onInput=${e=>set(e.target.value)} type=${type} placeholder=${ph} autoComplete="off"
        style=${{width:'100%',boxSizing:'border-box',padding:'11px 13px',borderRadius:10,border:'1px solid var(--line)',background:'var(--panel2)',font:'500 13.5px inherit',color:'var(--fg)',outline:'none'}}/>
    </label>`;
  return html`
  <div style=${{minHeight:'100vh',display:'flex',flexDirection:'column',background:'var(--bg)',color:'var(--fg)'}}>
    <header style=${{display:'flex',alignItems:'center',gap:12,padding:'16px 24px'}}>
      <a href="/" style=${{fontSize:15,fontWeight:700,letterSpacing:'-.01em',color:'var(--fg)',textDecoration:'none'}}>Sthir</a>
      <span style=${{fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--fg3)'}}>Lender console</span>
      <span style=${{flex:1}}></span>
      <button onClick=${()=>setTheme(theme==='light'?'dark':'light')} style=${{cursor:'pointer',padding:'7px 11px',borderRadius:8,border:'1px solid var(--line)',background:'var(--panel)',color:'var(--fg2)',font:'500 12px inherit'}}>${theme==='light'?'◑ Dark':'◐ Light'}</button>
    </header>
    <div style=${{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px',animation:'sthirIn .25s ease both'}}>
      <div style=${{width:'100%',maxWidth:380}}>
        <div style=${{textAlign:'center',marginBottom:22}}>
          <div style=${{fontSize:23,fontWeight:700,letterSpacing:'-.02em'}}>Lender console sign-in</div>
          <div style=${{marginTop:7,fontSize:13,color:'var(--fg2)'}}>Restricted — risk & portfolio staff only.</div>
        </div>
        <form onSubmit=${submit} style=${{padding:24,borderRadius:14,border:'1px solid var(--line)',background:'var(--panel)',boxShadow:'var(--shadow)',display:'flex',flexDirection:'column',gap:15}}>
          ${field('Work email', id, setId, 'text', 'admin@sthir.in')}
          ${field('Password', pass, setPass, 'password', '••••••••')}
          ${err?html`<div style=${{fontSize:12,color:'var(--neg)',fontWeight:600}}>${err}</div>`:null}
          <button type="submit" style=${{cursor:'pointer',padding:13,borderRadius:10,border:0,background:'var(--active)',color:'#FFFFFF',font:'700 13.5px inherit'}}>Sign in</button>
        </form>
        <div style=${{marginTop:16,padding:'13px 15px',borderRadius:12,border:'1px dashed var(--line)',background:'var(--panel)'}}>
          <div style=${{fontSize:10,fontWeight:700,letterSpacing:'.09em',textTransform:'uppercase',color:'var(--fg3)'}}>Demo admin login</div>
          <div style=${{marginTop:8,display:'flex',flexDirection:'column',gap:4,font:"400 12px 'IBM Plex Mono',monospace",color:'var(--fg2)'}}>
            <div>email · <strong style=${{color:'var(--fg)'}}>admin@sthir.in</strong></div>
            <div>password · <strong style=${{color:'var(--fg)'}}>sthir2026</strong></div>
          </div>
          <button type="button" onClick=${()=>{setId(ADMIN.id);setPass(ADMIN.pass);setErr('');}} style=${{marginTop:11,width:'100%',cursor:'pointer',padding:9,borderRadius:9,border:'1px solid var(--line)',background:'var(--panel2)',color:'var(--fg)',font:'600 12px inherit'}}>Fill demo credentials</button>
        </div>
        <div style=${{marginTop:16,textAlign:'center',fontSize:11,color:'var(--fg3)'}}>Prototype · simulated funds · mock keys. No real credentials are collected.</div>
      </div>

function App() {
  const [screen, setScreen] = useState('portfolio');
  const [theme, setTheme] = useState('light');
  const [portfolio, setPortfolio] = useState(null);
  const [sources, setSources] = useState(null);
  const [events, setEvents] = useState(null);
  const [tierMix, setTierMix] = useState(null);
  const [invoices, setInvoices] = useState(null);
  const [expSel, setExpSel] = useState(0);
  const [workerId, setWorkerId] = useState(null);
  const [authed, setAuthed] = useState(()=>{ try{ return localStorage.getItem('sthir_lender_auth')==='1'; }catch(e){ return false; } });
  const login = () => { try{ localStorage.setItem('sthir_lender_auth','1'); }catch(e){} setAuthed(true); };
  const logout = () => { try{ localStorage.removeItem('sthir_lender_auth'); }catch(e){} setAuthed(false); };

  useEffect(()=>{ document.body.setAttribute('data-theme', theme); },[theme]);

  const loadPortfolio = useCallback(()=>api('/portfolio').then(setPortfolio).catch(()=>{}),[]);
  const loadSources = useCallback(()=>api('/sources').then(setSources).catch(()=>{}),[]);
  useEffect(()=>{ loadPortfolio(); loadSources(); },[loadPortfolio,loadSources]);

  // tier mix + overdue invoices, computed live across workers
  useEffect(()=>{ (async()=>{
    try {
      const ws = await api('/workers');
      const counts={A:0,B:0,C:0}; const invs=[];
      for(const w of ws){ const inc = await api(`/workers/${w.id}/income`).catch(()=>[]);
        inc.forEach(e=>{ if(counts[e.tier]!=null) counts[e.tier]++; if(e.kind==='invoice') invs.push({...e, worker:w.name}); }); }
      setTierMix([
        {tier:'A',label:'Crypto / platform-verified',n:counts.A,color:'var(--pos)'},
        {tier:'B',label:'Plausible reference match',n:counts.B,color:'var(--info)'},
        {tier:'C',label:'AI-read from photo',n:counts.C,color:'var(--warn)'},
      ]);
      setInvoices(invs);
    } catch(e){}
  })(); },[]);

  // activity polling
  useEffect(()=>{ let live=true; const tick=()=>api('/events?limit=40').then(e=>{ if(live) setEvents(e); }).catch(()=>{});
    tick(); const id=setInterval(tick, 4000); return ()=>{ live=false; clearInterval(id); }; },[]);

  const flag = async (sid) => {
    const ws = await api('/workers').catch(()=>[]);
    const wid = ws[0] && ws[0].id; if(!wid) return;
    const body = new URLSearchParams(); body.set('worker_id', wid);
    await api(`/sources/${sid}/flag`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body}).catch(()=>{});
    loadSources();
  };
  const resetDemo = async () => { await api('/demo/reset',{method:'POST'}).catch(()=>{}); loadPortfolio(); loadSources(); };
  const openWorker = id => { setWorkerId(id); setScreen('worker'); };

  if(!authed) return html`<${LenderLogin} onLogin=${login} theme=${theme} setTheme=${setTheme}/>`;

  const [title, sub] = TITLES[screen] || TITLES.portfolio;
  const body = {
    portfolio: html`<${Portfolio} data=${portfolio}/>`,
    distress: html`<${Distress} cases=${portfolio&&portfolio.distress_cases} onWorker=${openWorker}/>`,
    sources: html`<${Sources} sources=${sources} onFlag=${flag}/>`,
    fraud: html`<${Fraud} tierMix=${tierMix} rings=${portfolio&&portfolio.fraud_rings}/>`,
    exposure: html`<${Exposure} invoices=${invoices} sel=${expSel} setSel=${setExpSel}/>`,
    activity: html`<${Activity} events=${events}/>`,
    worker: html`<${WorkerView} workerId=${workerId}/>`,
  }[screen];

  return html`
  <div style=${{minHeight:'100vh',display:'flex',background:'var(--bg)',color:'var(--fg)'}}>
    <aside style=${{flex:'none',width:236,borderRight:'1px solid var(--line)',background:'var(--panel2)',display:'flex',flexDirection:'column',position:'sticky',top:0,height:'100vh'}}>
      <div style=${{padding:'20px 18px',borderBottom:'1px solid var(--line)'}}>
        <a href="/" style=${{fontSize:15,fontWeight:700,letterSpacing:'-.01em',color:'var(--fg)',textDecoration:'none'}}>← Sthir</a>
        <div style=${{marginTop:2,fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--fg3)'}}>Lender console</div>
      </div>
      <nav style=${{flex:1,padding:'12px 10px',display:'flex',flexDirection:'column',gap:2}}>
        ${NAV.map(n=>{ const active=screen===n.key; const count = n.key==='distress'&&portfolio?(portfolio.distress_cases||[]).length:0; return html`
          <button key=${n.key} onClick=${()=>setScreen(n.key)} style=${{display:'flex',alignItems:'center',gap:10,width:'100%',textAlign:'left',cursor:'pointer',padding:'10px 12px',borderRadius:11,border:0,background:active?'var(--active)':'transparent',color:active?'#FFFFFF':'var(--fg2)',font:(active?600:500)+' 13px/1.2 inherit'}}>
            <${Icon} name=${n.key} color=${active?'var(--activeIcon)':'var(--fg3)'}/>
            <span style=${{flex:1}}>${n.label}</span>
            ${count?html`<span style=${{flex:'none',padding:'1px 6px',borderRadius:20,background:active?'rgba(255,255,255,.16)':'var(--negSoft)',color:active?'#FFFFFF':'var(--neg)',font:"600 10.5px/1.5 'IBM Plex Mono',monospace"}}>${count}</span>`:null}
          </button>`; })}
      </nav>
      <div style=${{padding:'12px 14px',borderTop:'1px solid var(--line)',display:'flex',flexDirection:'column',gap:8}}>
        <button onClick=${()=>setTheme(theme==='light'?'dark':'light')} style=${{cursor:'pointer',padding:'8px 10px',borderRadius:8,border:'1px solid var(--line)',background:'var(--panel)',color:'var(--fg2)',font:'500 12px inherit',textAlign:'left'}}>${theme==='light'?'◑ Dark theme':'◐ Light theme'}</button>
        <button onClick=${resetDemo} style=${{cursor:'pointer',padding:'8px 10px',borderRadius:8,border:'1px solid var(--line)',background:'var(--panel)',color:'var(--fg2)',font:'500 12px inherit',textAlign:'left'}}>Reset demo data</button>
        <button onClick=${logout} style=${{cursor:'pointer',padding:'8px 10px',borderRadius:8,border:'1px solid var(--line)',background:'var(--panel)',color:'var(--neg)',font:'600 12px inherit',textAlign:'left'}}>⏻ Sign out</button>
        <div style=${{font:"400 10.5px/1.5 'IBM Plex Mono',monospace",color:'var(--fg3)'}}>Demo date 2026-09-03</div>
      </div>
    </aside>
    <main style=${{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}>
      <header style=${{position:'sticky',top:0,zIndex:10,display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,padding:'14px 24px',borderBottom:'1px solid var(--line)',background:'var(--panel)',boxShadow:'var(--shadow)'}}>
        <div>
          <h1 style=${{margin:0,fontSize:17,fontWeight:700,letterSpacing:'-.015em'}}>${title}</h1>
          <div style=${{marginTop:2,fontSize:12,color:'var(--fg2)'}}>${sub}</div>
        </div>
        <span style=${{padding:'5px 10px',borderRadius:6,background:'var(--warnSoft)',border:'1px solid var(--warn)',font:"600 11px/1.4 'IBM Plex Mono',monospace",color:'var(--warn)'}}>PROTOTYPE · simulated funds · mock keys</span>
      </header>
      <div style=${{flex:1,padding:24,animation:'sthirIn .25s ease both'}}>${body}</div>
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
