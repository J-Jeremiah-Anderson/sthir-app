const API = (window.STHIR_API || '') + '/api';
async function api(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  return r.status === 204 ? null : r.json();
}
const fmt = n => { const x = Number(n); return Number.isFinite(x) ? '₹' + Math.round(x).toLocaleString('en-IN') : '₹—'; };

const prettyCrisis = t => (t||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
const weekLabel = (dstr) => {
  if(!dstr) return '—';
  const d = new Date(dstr); if(isNaN(d)) return dstr;
  const day = (d.getDay()+6)%7; const mon = new Date(d); mon.setDate(d.getDate()-day);
  return 'Week of ' + mon.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
};

function TX(text, lang) {
  if (lang === 'en' || !text) return text;
  const L = BE[lang]; if (!L) return text;
  if (L.exact[text] !== undefined) return L.exact[text];
  for (const [re, fn] of L.rx) { const m = text.match(re); if (m) return fn(m); }
  return text;
}

const BILL_META = {
  rent:     { day:5,  color:'#2E5A87', tint:'#E4F0F9' },
  emi:      { day:10, color:'#B23A2C', tint:'rgba(178,58,44,.10)' },
  utility:  { day:18, color:'#C08A2E', tint:'#FBF1DC' },
  input:    { day:20, color:'#15803d', tint:'#E3F3E8' },
  family:   { day:26, color:'#7C5CD6', tint:'rgba(124,92,214,.12)' },
};
function buildReminders(detail, lang='en') {
  const L = I18N[lang] || I18N.en;
  const as = ((detail && detail.resilience && detail.resilience.as_of) || '2026-09-03');
  const asOf = new Date(as + 'T00:00:00'); const y = asOf.getFullYear(), m = asOf.getMonth();
  const lines = (detail && detail.resilience && detail.resilience.obligations && detail.resilience.obligations.lines) || [];
  const seen = {};
  const out = [];
  lines.forEach(l => {
    const meta = BILL_META[l.category]; if (!meta) return;
    const idx = (seen[l.category] = (seen[l.category]||0)); seen[l.category]++;
    let day = meta.day + idx*3; const dim = new Date(y, m+1, 0).getDate(); if (day>dim) day = dim;
    out.push({ head:trMap(L.heads, l.head), label:L.cat[l.category]||l.category, color:meta.color, tint:meta.tint,
      amount:l.monthly, apr:l.apr, is_debt:l.is_debt, day, dateLabel: day + ' ' + L.months[m] });
  });
  out.sort((a,b)=>a.day-b.day);
  return { reminders: out, y, m, today: asOf.getDate() };
}

  const first = new Date(y, m, 1); const startCol = (first.getDay()+6)%7; const dim = new Date(y, m+1, 0).getDate();
  const cells = []; for (let i=0;i<startCol;i++) cells.push(null); for (let d=1;d<=dim;d++) cells.push(d);
  const WD = L.weekdays;

  <div style=${{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(380px,1fr))',gap:16,alignItems:'start'}}>

          <${Eyebrow}>${t.ladderLabel}<//>

                <span style=${{flex:1,fontSize:12.5,lineHeight:1.5,color:'#2E271E'}}><strong>${TX(st.label,lang)}</strong>${st.detail?html`<span style=${{display:'block',color:'#6A5D4E',marginTop:2}}>${TX(st.detail,lang)}</span>`:null}</span>
              </div>`)}
          </div>
        </div>
      </div>`;
    })}
  </div>`;
}

function Income({ income, lang='en' }) {
  if (!income) return html`<${Spinner} color="#2E5A87" title="Loading…" sub=""/>`;
  const groups = {};
  income.forEach(e=>{ const w = weekLabel(e.received_date||e.expected_date); (groups[w]=groups[w]||[]).push(e); });
  return html`
  <div style=${{maxWidth:760}}>
    <div style=${{display:'flex',gap:20,padding:'14px 18px',borderRadius:8,border:'1px solid #E5DAC7',background:'#FFFDF8',marginBottom:16,fontSize:11.5,color:'#6A5D4E',flexWrap:'wrap'}}>
      <span><strong style=${{color:'#15803d'}}>A</strong> — ${ux(lang).tierA}</span>
      <span><strong style=${{color:'#2E5A87'}}>B</strong> — ${ux(lang).tierB}</span>
      <span><strong style=${{color:'#A9721E'}}>C</strong> — ${ux(lang).tierC}</span>
    </div>
    ${(()=>{ const chart=Object.entries(groups).map(([wk,rows])=>({wk,total:rows.reduce((s,e)=>s+e.gross,0)})).reverse();
      if(chart.length<2) return null; const cmax=Math.max(1,...chart.map(c=>c.total));
      return html`<${Card} style=${{marginBottom:16}}>
        <${Eyebrow}>${ux(lang).weeklyIncome}<//>
        <div style=${{marginTop:16,height:120,display:'flex',alignItems:'flex-end',gap:6,borderBottom:'1px solid #CFC3AE'}}>
          ${chart.map((c,i)=>html`<div key=${i} title=${c.wk+': '+fmt(c.total)} style=${{flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',height:'100%'}}>
            <div style=${{height:Math.max(3,(c.total/cmax)*100)+'%',borderRadius:'3px 3px 0 0',background:'linear-gradient(180deg,#3D6FA0,#2E5A87)'}}></div>
          </div>`)}
        </div>
        <div style=${{marginTop:6,display:'flex',justifyContent:'space-between',fontSize:9.5,color:'#B0A290',fontVariantNumeric:'tabular-nums'}}>
          <span>${chart[0].wk}</span><span>${chart[chart.length-1].wk}</span>
        </div>
      <//>`; })()}
    <div style=${{display:'flex',flexDirection:'column',gap:18}}>
      ${Object.entries(groups).map(([wk,rows],i)=>{
        const total = rows.reduce((s,e)=>s+e.gross,0);
        return html`
        <div key=${i}>
          <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 4px 8px'}}>
            <span style=${{fontSize:10.5,fontWeight:800,letterSpacing:'.1em',textTransform:'uppercase',color:'#8B7E6E'}}>${wk}</span>
            <span style=${{fontSize:13.5,fontWeight:800,fontVariantNumeric:'tabular-nums'}}>${fmt(total)}</span>
          </div>
          <div style=${{display:'flex',flexDirection:'column',gap:8}}>
            ${rows.map((e,j)=>{ const tr=tierOf(e.tier); const overdue=e.status==='overdue'; return html`
              <div key=${j} style=${{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',borderRadius:8,border:'1px solid #E5DAC7',background:'#FFFDF8'}}>
                <span style=${{flex:'none',width:34,height:34,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background:tr.tint,border:'1px solid '+tr.ring,fontSize:14,fontWeight:800,color:tr.color}}>${e.tier}</span>
                <span style=${{flex:1,minWidth:0}}>
                  <span style=${{display:'flex',alignItems:'center',gap:7,fontSize:13.5,fontWeight:700}}>${e.source_name||e.reference}
                    ${e.tier==='A'?html`<span style=${{flex:'none',fontFamily:"'Fraunces',serif",fontSize:8,fontWeight:700,letterSpacing:'.14em',color:'#3E7C4F',border:'1.5px solid #3E7C4F',borderRadius:3,padding:'1px 4px',transform:'rotate(-5deg)',opacity:.8,textTransform:'uppercase'}}>Verified</span>`:null}
                  </span>
                  <span style=${{display:'block',marginTop:2,fontSize:11,color:'#6A5D4E'}}>${e.received_date||e.expected_date} · ${ux(lang).kinds[e.kind]||e.kind.replace(/_/g,' ')}</span>
                </span>
                <span style=${{flex:'none',textAlign:'right'}}>
                  <span style=${{display:'block',fontSize:14.5,fontWeight:800,fontVariantNumeric:'tabular-nums'}}>${fmt(e.gross)}</span>
                  ${overdue?html`<span style=${{display:'block',marginTop:2,fontSize:9.5,fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',color:'#A9721E'}}>${ux(lang).overdue}</span>`:null}
                </span>
              </div>`;})}
          </div>

      })}

function Submit({ workerId, samples, detail, onAdvance, reload, lang='en' }) {
  const U = ux(lang);
  const [phase, setPhase] = useState('pick'); // pick | reading | preview | verifying | result
  const [result, setResult] = useState(null);
  const [before, setBefore] = useState(null);
  const fileRef = useRef(null);
  const [file, setFile] = useState(null);
  const [kind, setKind] = useState('gig_payout');
  const [gross, setGross] = useState('');
  const [ref, setRef] = useState('');
  const [upErr, setUpErr] = useState('');
  const [preview, setPreview] = useState(null); // {token, read_amount, source_name, document_type, date, confidence, backend, evidence_url}
  const pick = async (s) => {
    setBefore(detail ? detail.resilience.resilience_score : null);
    setPhase('verifying');
    try { const r = await api(`/income/${s.income_event_id}/verify`, {method:'POST'}); setResult({...r, sample:s}); setPhase('result'); }
    catch(e){ setPhase('pick'); }
  };
  const onFile = (e) => { const f = e.target.files && e.target.files[0]; if(f){ setFile(f); setUpErr(''); } };
  // Step 1 — let the AI read the document, without booking anything yet.
  const runPreview = async () => {
    if(!file){ setUpErr(U.chooseFirst); return; }
    setUpErr(''); setPhase('reading');
    try {
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch(API + `/workers/${workerId}/extract-preview`, { method:'POST', body:fd });
      if(!r.ok) throw new Error('preview ' + r.status);
      const data = await r.json();
      if(data.rejected){ setUpErr(data.reason_code==='not_income' ? U.notIncome : (data.reason||U.upFail)); setPhase('pick'); return; }
      setPreview(data);
      if(data.read_amount!=null && data.read_amount>0) setGross(String(Math.round(data.read_amount)));
      setPhase('preview');
    } catch(e){ setUpErr(U.upFail); setPhase('pick'); }
  };
  // Step 2 — book at the amount the worker confirmed (re-uses the read; no 2nd AI call).
  const confirmSubmit = async () => {
    const amt = parseFloat(gross);
    if(!Number.isFinite(amt) || amt<=0){ setUpErr(U.enterAmount); return; }
    if(!preview){ setUpErr(U.upFail); return; }
    setBefore(detail ? detail.resilience.resilience_score : null);
    setUpErr(''); setPhase('verifying');
    try {
      const fd = new FormData();
      fd.append('token', preview.token); fd.append('gross', String(amt)); fd.append('kind', kind); fd.append('reference', ref);
      const r = await fetch(API + `/workers/${workerId}/confirm-income`, { method:'POST', body:fd });
      if(!r.ok) throw new Error('confirm ' + r.status);
      const data = await r.json();
      if(data.rejected){ setUpErr(data.reason_code==='amount_mismatch' ? U.mismatch(data.claimed, data.document_amount) : (data.reason_code==='duplicate_proof' ? U.duplicate : (data.reason||U.upFail))); setPhase('preview'); return; }
      setResult({ ...data, sample:{ reference: data.reference || ref || file.name, gross: amt, kind, source_name: ref || preview.source_name || file.name } });
      setFile(null); setGross(''); setRef(''); setPreview(null);
      setPhase('result');
    } catch(e){ setUpErr(U.upFail); setPhase('preview'); }
  };
  if (phase==='reading') return html`<div style=${{maxWidth:680}}><${Spinner} color="#2E5A87" title=${U.readingDoc} sub=${U.readingDocSub}/></div>`;
  if (phase==='verifying') return html`<div style=${{maxWidth:680}}><${Spinner} color="#2E5A87" title=${U.verifying} sub=${U.verifyingSub}/></div>`;
  if (phase==='preview' && preview) {
    const conf = preview.confidence!=null ? Math.round(preview.confidence*100) : null;
    const row = (label, val) => html`<div style=${{display:'flex',justifyContent:'space-between',gap:12,padding:'7px 0',borderBottom:'1px solid #EFE7D8',fontSize:12.5}}><span style=${{color:'#8B7E6E'}}>${label}</span><span style=${{fontWeight:700,color:'#4A4034',textAlign:'right'}}>${val}</span></div>`;
    return html`
    <div style=${{maxWidth:680,display:'flex',flexDirection:'column',gap:16,animation:'sthirRise .3s ease both'}}>
      <${Card}>
        <${Eyebrow} color="#6A5D4E">${U.weRead} · ${preview.backend}<//>
        <div style=${{marginTop:12,display:'flex',gap:16,alignItems:'flex-start'}}>
          <img src=${(window.STHIR_API||'') + preview.evidence_url} alt="proof" style=${{flex:'none',width:96,height:96,objectFit:'cover',borderRadius:10,border:'1px solid #E5DAC7'}}/>
          <div style=${{flex:1,minWidth:0}}>
            <div style=${{fontSize:11,letterSpacing:'.08em',textTransform:'uppercase',color:'#8B7E6E'}}>${U.readAmount}</div>
            <div style=${{marginTop:2,fontSize:30,fontWeight:800,color:'#233150',fontVariantNumeric:'tabular-nums'}}>${preview.read_amount!=null&&preview.read_amount>0?fmt(preview.read_amount):'—'}</div>
            <div style=${{marginTop:8}}>
              ${preview.source_name?row(U.readSource, preview.source_name):null}
              ${preview.date?row(U.readDate, preview.date):null}
              ${preview.document_type?row(U.readType, String(preview.document_type).replace(/_/g,' ')):null}
              ${conf!=null?row(U.confidence, conf+'%'):null}
            </div>
          </div>
        </div>
      <//>
      <${Card}>
        <div style=${{fontSize:12,color:'#8B7E6E',lineHeight:1.5,marginBottom:12}}>${preview.read_amount!=null&&preview.read_amount>0?U.adjustHint:U.noAmountRead}</div>
        <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <label><span style=${{display:'block',fontSize:11,fontWeight:700,color:'#6A5D4E',marginBottom:5}}>${U.amount}</span>
            <input value=${gross} onInput=${e=>setGross(e.target.value)} type="number" inputMode="decimal" placeholder="e.g. 1800"
              style=${{width:'100%',boxSizing:'border-box',padding:'10px 12px',borderRadius:10,border:'1px solid #E3D8C6',background:'#FBF6EC',font:'600 15px inherit',outline:'none'}}/></label>
          <label><span style=${{display:'block',fontSize:11,fontWeight:700,color:'#6A5D4E',marginBottom:5}}>${U.type}</span>
            <select value=${kind} onChange=${e=>setKind(e.target.value)} style=${{width:'100%',boxSizing:'border-box',padding:'10px 12px',borderRadius:10,border:'1px solid #E3D8C6',background:'#FBF6EC',font:'500 14px inherit',outline:'none'}}>
              <option value="gig_payout">${U.kinds.gig_payout}</option><option value="invoice">${U.kinds.invoice}</option><option value="cash_gig">${U.kinds.cash_gig}</option><option value="salary">${U.kinds.salary}</option>
            </select></label>
        </div>
        <label style=${{display:'block',marginTop:10}}><span style=${{display:'block',fontSize:11,fontWeight:700,color:'#6A5D4E',marginBottom:5}}>${U.refOpt}</span>
          <input value=${ref} onInput=${e=>setRef(e.target.value)} type="text" placeholder="Invoice no. / payout ref"
            style=${{width:'100%',boxSizing:'border-box',padding:'10px 12px',borderRadius:10,border:'1px solid #E3D8C6',background:'#FBF6EC',font:'500 14px inherit',outline:'none'}}/></label>
        ${upErr?html`<div style=${{marginTop:10,fontSize:12.5,color:'#B23A2C',fontWeight:600}}>${upErr}</div>`:null}
        <div style=${{marginTop:14,display:'grid',gridTemplateColumns:'1fr 2fr',gap:10}}>
          <button onClick=${()=>{setPhase('pick');setPreview(null);setGross('');setUpErr('');}} style=${{cursor:'pointer',padding:12,borderRadius:10,border:'1px solid #E5DAC7',background:'#FFFDF8',color:'#241E17',font:'700 13px inherit'}}>${U.backEdit}</button>
          <button onClick=${confirmSubmit} style=${{cursor:'pointer',padding:12,borderRadius:10,border:0,background:'#233150',color:'#FFFDF8',font:'800 13px inherit'}}>${U.confirmSubmit}</button>
        </div>
      <//>
    </div>`;
  }
  if (phase==='result' && result && result.verification) {
    const v = result.verification, tr = tierOf(v.tier);
    const after = result.resilience.resilience_score;
    const delta = before!=null ? after-before : 0;
    return html`
    <div style=${{maxWidth:680,display:'flex',flexDirection:'column',gap:16,animation:'sthirRise .35s ease both'}}>
      <${Card} style=${{border:'1px solid '+tr.ring}}>
        <div style=${{display:'flex',alignItems:'center',gap:14}}>
          <div style=${{flex:'none',width:56,height:56,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',background:tr.tint,border:'1px solid '+tr.ring,fontSize:26,fontWeight:800,color:tr.color}}>${v.tier}</div>
          <div style=${{flex:1}}>
            <${Eyebrow} color="#6A5D4E">${U.verifiedTier} ${v.tier} · ${result.backend}<//>
            <div style=${{marginTop:4,fontSize:14.5,fontWeight:700,color:tr.color}}>${result.sample.source_name||result.sample.reference}</div>
            <div style=${{marginTop:3,fontSize:12,color:'#6A5D4E'}}>${fmt(result.sample.gross)}</div>
          </div>
        </div>
        <div style=${{marginTop:15,display:'flex',flexDirection:'column',gap:8}}>
          ${(v.signals||[]).map((c,i)=>html`<div key=${i} style=${{display:'flex',gap:9,alignItems:'flex-start',fontSize:12.5,lineHeight:1.45,color:'#4A4034'}}><span style=${{flex:'none',color:'#15803d',fontWeight:800}}>✓</span><span>${TX(c,lang)}</span></div>`)}
        </div>
      <//>
      <${Card}>
        <${Eyebrow} color="#6A5D4E">${U.resilienceRefreshed}<//>
        <div style=${{marginTop:14,display:'flex',alignItems:'center',gap:16}}>
          <div style=${{textAlign:'center'}}><div style=${{fontSize:26,fontWeight:800,color:'#8B7E6E',fontVariantNumeric:'tabular-nums'}}>${before??'—'}</div><div style=${{fontSize:9.5,letterSpacing:'.1em',textTransform:'uppercase',color:'#8B7E6E'}}>${U.before}</div></div>
          <div style=${{flex:1,height:10,borderRadius:999,background:'rgba(90,60,30,.07)',position:'relative',overflow:'hidden'}}>
            <div style=${{position:'absolute',inset:0,width:after+'%',background:'#16A34A',transformOrigin:'left',animation:'sthirFill .8s ease both'}}></div>
          </div>
          <div style=${{textAlign:'center'}}><div style=${{fontSize:30,fontWeight:800,color:'#15803d',fontVariantNumeric:'tabular-nums'}}>${after}</div><div style=${{fontSize:9.5,letterSpacing:'.1em',textTransform:'uppercase',color:'#15803d'}}>${delta>=0?'+':''}${delta}</div></div>
        </div>
      <//>
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <button onClick=${()=>{setPhase('pick');setResult(null);reload&&reload();}} style=${{cursor:'pointer',padding:15,borderRadius:8,border:'1px solid #E5DAC7',background:'#FFFDF8',color:'#241E17',font:'700 13px inherit'}}>${U.submitAnother}</button>
        <button onClick=${()=>onAdvance(result.income_event_id)} style=${{cursor:'pointer',padding:15,borderRadius:8,border:'1px solid rgba(46,90,135,.4)',background:'#2E5A87',color:'#FFFDF8',font:'800 13px inherit'}}>${U.requestAdvance}</button>
      </div>
    </div>`;
  }
  // pick
  const mine = (samples||[]).filter(s=>s.worker_id===workerId);
  return html`
  <div style=${{maxWidth:680}}>
    <div style=${{display:'flex',flexDirection:'column',gap:10}}>
      ${mine.length ? mine.map((s,i)=>html`
        <button key=${i} onClick=${()=>pick(s)} style=${{display:'flex',alignItems:'center',gap:14,width:'100%',textAlign:'left',cursor:'pointer',padding:14,borderRadius:12,border:'1px solid #E5DAC7',background:'#FFFDF8',color:'#241E17'}}>
          <span style=${{flex:'none',width:54,height:54,borderRadius:8,border:'1px solid #E5DAC7',background:'repeating-linear-gradient(135deg,rgba(90,60,30,.07) 0 6px,rgba(90,60,30,.02) 6px 12px)',display:'flex',alignItems:'center',justifyContent:'center',font:'600 7px/1.2 ui-monospace,monospace',color:'#6A5D4E',textAlign:'center',padding:4}}>${U.kinds[s.kind]||s.kind.replace(/_/g,' ')}</span>
          <span style=${{flex:1,minWidth:0}}>
            <span style=${{display:'block',fontSize:14,fontWeight:700}}>${s.reference}</span>
            <span style=${{display:'block',marginTop:3,fontSize:11.5,color:'#6A5D4E'}}>${U.kinds[s.kind]||s.kind.replace(/_/g,' ')}</span>
          </span>
          <span style=${{flex:'none',fontSize:14.5,fontWeight:800,fontVariantNumeric:'tabular-nums'}}>${fmt(s.gross)}</span>

function Savings({ savings, detail, lang='en' }) {
  const U = ux(lang);

  const bal = savings.balance||0; const target = 20000; const pct = Math.min(100, bal/target*100);
  const tx = savings.transactions||[];
  let run = bal; const hist = [bal];
  tx.forEach(r=>{ const a = r.amount!=null?r.amount:(r.delta||0); run -= a; hist.push(run); });
  const series = hist.slice().reverse();
  return html`
  <div style=${{display:'flex',flexDirection:'column',gap:16,maxWidth:980}}>
  ${series.length>=2 ? html`<${Card}>
    <div style=${{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>

      const xs=i=>P+i*((W-2*P)/(series.length-1)); const ys=v=>H-P-((v-mn)/(mx-mn))*(H-2*P);
      const line=series.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
      const area=line+' L '+xs(series.length-1).toFixed(1)+' '+(H-P)+' L '+xs(0).toFixed(1)+' '+(H-P)+' Z';
      return html`<svg viewBox=${'0 0 '+W+' '+H} preserveAspectRatio="none" style=${{marginTop:14,width:'100%',height:120,display:'block'}}>

        <path d=${area} fill="url(#savg)"/>
        <path d=${line} fill="none" stroke="#15803d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx=${xs(series.length-1)} cy=${ys(series[series.length-1])} r="3.5" fill="#15803d"/>

  <div style=${{display:'grid',gridTemplateColumns:'.9fr 1.1fr',gap:16,alignItems:'start'}}>
    <div style=${{padding:24,borderRadius:12,border:'1px solid rgba(21,128,61,.3)',background:'#F0FDF4'}}>

      <div style=${{marginTop:16,height:10,borderRadius:999,background:'rgba(90,60,30,.08)',overflow:'hidden'}}><div style=${{height:'100%',width:pct+'%',borderRadius:999,background:'#16A34A'}}></div></div>
      <div style=${{marginTop:9,fontSize:12,color:'#6A5D4E'}}>${pct.toFixed(0)}% ${U.cushionA} ${fmt(target)} ${U.cushionB} ${Math.round((savings.autosave_rate||0)*100)}%</div>
    </div>
    <div>
      <div style=${{fontSize:10.5,fontWeight:800,letterSpacing:'.12em',textTransform:'uppercase',color:'#8B7E6E',padding:'0 4px 10px'}}>${U.ledgerLabel}</div>
      <div style=${{display:'flex',flexDirection:'column',gap:8}}>
        ${tx.length?tx.map((r,i)=>{ const inc=(r.amount||r.delta||0)>=0; const amt=r.amount!=null?r.amount:r.delta; const col=inc?'#15803d':'#B23A2C'; return html`

        </div>
        ${nav.map(n=>html`
          <button key=${n.key} onClick=${()=>go(n.key)} style=${{display:'flex',alignItems:'center',gap:11,width:'100%',textAlign:'left',cursor:'pointer',padding:'10px 13px',border:0,borderRadius:11,background:n.active?'#233150':'transparent',color:n.active?'#FFFDF8':'#8B7E6E',font:(n.active?700:600)+' 13.5px/1.2 inherit'}}>
            <${Icon} name=${n.key} color=${n.active?'#5C83B6':'#B0A290'}/>
            <span style=${{flex:1}}>${n.label}</span>
            ${n.badge?html`<span style=${{flex:'none',minWidth:18,textAlign:'center',padding:'2px 6px',borderRadius:999,background:n.active?'rgba(255,255,255,.16)':'rgba(178,58,44,.12)',color:n.active?'#FFFDF8':'#B23A2C',font:'700 10.5px inherit'}}>${n.badge}</span>`:null}
          </button>`)}
        <span style=${{flex:1}}></span>
        <button onClick=${()=>go('crisis')} style=${{display:'flex',alignItems:'center',justifyContent:'center',gap:9,cursor:'pointer',padding:14,borderRadius:12,border:'1.5px solid '+(screen==='crisis'?'#B23A2C':'#EAC9B8'),background:screen==='crisis'?'#B23A2C':'#FBEDE6',color:screen==='crisis'?'#FFFDF8':'#B23A2C',font:'800 13.5px/1.2 inherit'}}>
          <${Icon} name="crisis" color=${screen==='crisis'?'#FFFDF8':'#B23A2C'}/>${t.nav.crisis}</button>
      </aside>
      <main style=${{flex:1,minWidth:0,padding:'24px 28px 48px 16px',animation:'sthirRise .3s ease both'}}>
        <div style=${{padding:'2px 4px 18px'}}>
          <div style=${{fontSize:24,fontWeight:800,letterSpacing:'-.02em'}}>${t.nav[titleKey]}</div>
          <div style=${{marginTop:4,fontSize:13,color:'#6A5D4E'}}>${t.subs[titleKey]}</div>
        </div>
        ${scr}
      </main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
